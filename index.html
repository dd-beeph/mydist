<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DistribusiKu</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .kotak-login { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        .grup-input { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { background-color: #93c5fd; }
        .error { color: #dc2626; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="kotak-login" x-data="logikaLogin()">
        <h2 style="text-align: center; margin-top: 0; color: #1e3a8a;">DistribusiKu</h2>
        <p style="text-align: center; font-size: 14px; color: #666; margin-bottom: 20px;">Silakan masuk ke akun Anda</p>
        
        <form @submit.prevent="prosesLogin">
            <div class="grup-input">
                <label>Email</label>
                <input type="email" x-model="email" required placeholder="Email karyawan...">
            </div>
            <div class="grup-input">
                <label>Password</label>
                <input type="password" x-model="password" required placeholder="Kata sandi...">
            </div>
            
            <button type="submit" x-text="sedangMemuat ? 'Memproses...' : 'Masuk'" :disabled="sedangMemuat"></button>
            
            <div class="error" x-show="pesanError" x-text="pesanError"></div>
        </form>
    </div>

    <script>
        function logikaLogin() {
            return {
                email: '',
                password: '',
                sedangMemuat: false,
                pesanError: '',
                
                async prosesLogin() {
                    this.sedangMemuat = true;
                    this.pesanError = '';
                    
                    try {
                        // ==========================================
                        // PERHATIAN: MASUKKAN KUNCI BAPAK DI SINI
                        // ==========================================
                        const URL_SUPABASE = 'https://xdnakucqtbzzfhzromaj.supabase.co/rest/v1/';
                        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkbmFrdWNxdGJ6emZoenJvbWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MjA1MDAsImV4cCI6MjEwOTA5NjUwMH0.Z3Rurc_A-QjjcdkePyOVuuHEvFadEdnJuL2UaTfbf9g';
                        // ==========================================
                        
                        const supabaseClient = supabase.createClient(URL_SUPABASE, ANON_KEY);                        
                        const { data, error } = await supabaseClient.auth.signInWithPassword({
                            email: this.email,
                            password: this.password,
                        });
                        
                        if (error) {
                            this.pesanError = 'Login gagal. Periksa kembali email dan password Anda.';
                            this.sedangMemuat = false;
                        } else {
                            // Jika berhasil, langsung pindah ke dashboard
                            window.location.href = 'dashboard.html';
                        }
                    } catch (err) {
                        this.pesanError = 'Terjadi kesalahan sistem atau kunci tidak valid.';
                        this.sedangMemuat = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
